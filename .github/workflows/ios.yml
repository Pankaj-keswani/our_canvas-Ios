name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode 16
      run: |
        XCODE16_PATH=$(ls -d /Applications/Xcode_16*.app | head -n 1)
        echo "Using $XCODE16_PATH"
        sudo xcode-select -s "$XCODE16_PATH/Contents/Developer"

    - name: Install XcodeGen
      run: brew install xcodegen || brew upgrade xcodegen || true

    - name: Generate Xcode Project
      run: |
        xcodegen generate > error_log.txt 2>&1 || (
          git config --global user.name "CI Bot"
          git config --global user.email "ci@example.com"
          git add error_log.txt
          git commit -m "Upload xcodegen error log"
          git push origin HEAD:main
          exit 1
        )

    - name: Build and Test
      run: |
        xcodebuild test \
          -project OurCanvas.xcodeproj \
          -scheme OurCanvas \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=latest' \
          -enableCodeCoverage YES \
          CODE_SIGNING_ALLOWED=NO > build_log.txt 2>&1 || (
          git config --global user.name "CI Bot"
          git config --global user.email "ci@example.com"
          git add build_log.txt
          git commit -m "Upload xcodebuild error log"
          git push origin HEAD:main
          exit 1
        )
