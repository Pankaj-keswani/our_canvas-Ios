name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Install XcodeGen
      run: |
        curl -sL https://github.com/yonaskolb/XcodeGen/releases/download/2.39.0/xcodegen.zip -o xcodegen.zip
        unzip -q xcodegen.zip
        sudo cp -R xcodegen/bin/xcodegen /usr/local/bin/
        sudo cp -R xcodegen/share/xcodegen /usr/local/share/ || true

    - name: Generate Xcode Project
      run: |
        xcodegen generate 2>&1 | tee -a $GITHUB_STEP_SUMMARY || exit 1

    - name: Build and Test
      run: |
        xcodebuild test \
          -project OurCanvas.xcodeproj \
          -scheme OurCanvas \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=latest' \
          -enableCodeCoverage YES \
          CODE_SIGNING_ALLOWED=NO
