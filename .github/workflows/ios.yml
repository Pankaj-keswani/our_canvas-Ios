name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Generate Xcode Project
      run: |
        mint run yonaskolb/xcodegen generate > error_log.txt 2>&1 || (
          git config --global user.name "CI Bot"
          git config --global user.email "ci@example.com"
          git add error_log.txt
          git commit -m "Upload xcodegen error log"
          git push origin HEAD:main
          exit 1
        )

    - name: Build and Test
      run: |
        xcodebuild test \
          -project OurCanvas.xcodeproj \
          -scheme OurCanvas \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=latest' \
          -enableCodeCoverage YES \
          CODE_SIGNING_ALLOWED=NO
