name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4

    - name: Install XcodeGen
      run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen || true

    - name: Generate Xcode Project
      run: |
        xcodegen generate

    - name: Build and Test
      run: |
        xcodebuild test \
          -project OurCanvas.xcodeproj \
          -scheme OurCanvas \
          -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=latest' \
          -enableCodeCoverage YES \
          CODE_SIGNING_ALLOWED=NO
